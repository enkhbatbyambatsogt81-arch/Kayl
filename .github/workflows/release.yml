# «Ухаалаг дасгалжуулагч»-ийг Windows, macOS, Linux (бэлэн файл) болон Android (APK)-д зориулж угсарч,
# GitHub Releases-д байршуулна. v-ээр эхэлсэн tag (жишээ нь v2.3) push хийхэд ажиллана.
# Actions табаас гараар (Run workflow) ажиллуулахад: tag-ийг хоосон орхивол зөвхөн угсарч Artifacts-д хадгална,
# tag бичвэл (жишээ нь v2.3) тэр нэртэй tag ба Release-ийг үүсгэнэ.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release гаргах tag (жишээ нь v2.3). Хоосон бол зөвхөн угсарна."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, optional: false }
          - { os: macos-14, label: macos-apple-silicon, optional: false }
          - { os: macos-15-intel, label: macos-intel, optional: true }
          - { os: ubuntu-22.04, label: linux-x64, optional: false }
    defaults:
      run:
        shell: bash
        working-directory: body_tracking_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux-д MediaPipe-ийн OpenGL сан
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2

      - name: Сангуудыг суулгах
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тест
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest discover -s tests

      - name: Угсрах
        run: python -m PyInstaller packaging/ukhaalag.spec --noconfirm

      - name: Угсарсан файлыг шалгах (цонх нээхгүй)
        run: |
          export SELFTEST_LOG=selftest.log  # аппын хавтаст (Windows-д ч ажиллах харьцангуй зам)
          case "$RUNNER_OS" in
            Windows)
              pwsh -NoProfile -Command '$p = Start-Process -FilePath "dist\UkhaalagDasgaljuulagch\UkhaalagDasgaljuulagch.exe" -ArgumentList "--self-test" -Wait -PassThru; exit $p.ExitCode' || code=$? ;;
            macOS)
              dist/UkhaalagDasgaljuulagch.app/Contents/MacOS/UkhaalagDasgaljuulagch --self-test || code=$? ;;
            Linux)
              dist/UkhaalagDasgaljuulagch/UkhaalagDasgaljuulagch --self-test || code=$? ;;
          esac
          cat selftest.log || true
          exit ${code:-0}

      - name: Багцлах
        id: pack
        run: |
          VERSION=$(python -c "from form_checker import __version__; print(__version__)")
          NAME="UkhaalagDasgaljuulagch-v${VERSION}-${{ matrix.label }}"
          cp packaging/README_FIRST.txt dist/
          cd dist
          case "$RUNNER_OS" in
            Windows)
              mv UkhaalagDasgaljuulagch "$NAME"
              cp README_FIRST.txt "$NAME/"
              7z a -tzip "$NAME.zip" "$NAME" > /dev/null
              FILE="$NAME.zip" ;;
            macOS)
              mkdir "$NAME" && mv UkhaalagDasgaljuulagch.app README_FIRST.txt "$NAME/"
              ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip"
              FILE="$NAME.zip" ;;
            Linux)
              mv UkhaalagDasgaljuulagch "$NAME"
              cp README_FIRST.txt "$NAME/"
              tar -czf "$NAME.tar.gz" "$NAME"
              FILE="$NAME.tar.gz" ;;
          esac
          ls -la "$FILE"
          echo "file=body_tracking_app/dist/$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.pack.outputs.file }}
          retention-days: 14

  # Android утасны хувилбар (body_tracking_app/android/README.md)
  android:
    name: android-apk
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: body_tracking_app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Вэб хэсгийг угсрах (интерфейс, Pyodide, MediaPipe, Python логик)
        run: |
          npm ci
          python build_web.py

      - name: APK угсрах
        run: gradle --no-daemon assembleRelease

      - name: Шалгаж, нэрлэх
        id: pack
        run: |
          VERSION=$(python -c "import json; print(json.load(open('app/src/main/assets/www/build.json'))['version'])")
          FILE="UkhaalagDasgaljuulagch-v${VERSION}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$FILE"
          "$TOOLS/aapt" dump badging "$FILE" | head -4
          ls -la "$FILE"
          echo "file=body_tracking_app/android/$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.pack.outputs.file }}
          retention-days: 14

  # APK-г Android эмулятор дээр суулгаж ажиллуулж үзнэ. Release-ийг саатуулахгүй (эмулятор тогтворгүй байж болно).
  android-test:
    name: android-emulator-test
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Эмуляторт KVM идэвхжүүлэх
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash body_tracking_app/android/ci_emulator_test.sh apk/*.apk emulator-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android-emulator
          path: emulator-out
          retention-days: 14

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Байршуулах файлууд
        run: |
          find assets -type f ! -name 'UkhaalagDasgaljuulagch-*' -delete   # туршилтын зураг, лог орохгүй
          ls -la assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Ухаалаг дасгалжуулагч ${{ inputs.tag || github.ref_name }}
          body_path: body_tracking_app/packaging/release_notes.md
          files: assets/*
          fail_on_unmatched_files: true
