# «Ухаалаг дасгалжуулагч»-ийг Windows, macOS, Linux-д зориулж бэлэн файл болгон угсарч,
# GitHub Releases-д байршуулна. v-ээр эхэлсэн tag (жишээ нь v2.3) push хийхэд ажиллана.
# Actions табаас гараар (Run workflow) ажиллуулахад: tag-ийг хоосон орхивол зөвхөн угсарч Artifacts-д хадгална,
# tag бичвэл (жишээ нь v2.3) тэр нэртэй tag ба Release-ийг үүсгэнэ.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release гаргах tag (жишээ нь v2.3). Хоосон бол зөвхөн угсарна."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, optional: false }
          - { os: macos-14, label: macos-apple-silicon, optional: false }
          - { os: macos-15-intel, label: macos-intel, optional: true }
          - { os: ubuntu-22.04, label: linux-x64, optional: false }
    defaults:
      run:
        shell: bash
        working-directory: body_tracking_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux-д MediaPipe-ийн OpenGL сан
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2

      - name: Сангуудыг суулгах
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Тест
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest discover -s tests

      - name: Угсрах
        run: python -m PyInstaller packaging/ukhaalag.spec --noconfirm

      - name: Угсарсан файлыг шалгах (цонх нээхгүй)
        run: |
          export SELFTEST_LOG=selftest.log  # аппын хавтаст (Windows-д ч ажиллах харьцангуй зам)
          case "$RUNNER_OS" in
            Windows)
              pwsh -NoProfile -Command '$p = Start-Process -FilePath "dist\UkhaalagDasgaljuulagch\UkhaalagDasgaljuulagch.exe" -ArgumentList "--self-test" -Wait -PassThru; exit $p.ExitCode' || code=$? ;;
            macOS)
              dist/UkhaalagDasgaljuulagch.app/Contents/MacOS/UkhaalagDasgaljuulagch --self-test || code=$? ;;
            Linux)
              dist/UkhaalagDasgaljuulagch/UkhaalagDasgaljuulagch --self-test || code=$? ;;
          esac
          cat selftest.log || true
          exit ${code:-0}

      - name: Багцлах
        id: pack
        run: |
          VERSION=$(python -c "from form_checker import __version__; print(__version__)")
          NAME="UkhaalagDasgaljuulagch-v${VERSION}-${{ matrix.label }}"
          cp packaging/README_FIRST.txt dist/
          cd dist
          case "$RUNNER_OS" in
            Windows)
              mv UkhaalagDasgaljuulagch "$NAME"
              cp README_FIRST.txt "$NAME/"
              7z a -tzip "$NAME.zip" "$NAME" > /dev/null
              FILE="$NAME.zip" ;;
            macOS)
              mkdir "$NAME" && mv UkhaalagDasgaljuulagch.app README_FIRST.txt "$NAME/"
              ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip"
              FILE="$NAME.zip" ;;
            Linux)
              mv UkhaalagDasgaljuulagch "$NAME"
              cp README_FIRST.txt "$NAME/"
              tar -czf "$NAME.tar.gz" "$NAME"
              FILE="$NAME.tar.gz" ;;
          esac
          ls -la "$FILE"
          echo "file=body_tracking_app/dist/$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.pack.outputs.file }}
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Байршуулах файлууд
        run: ls -la assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Ухаалаг дасгалжуулагч ${{ inputs.tag || github.ref_name }}
          body_path: body_tracking_app/packaging/release_notes.md
          files: assets/*
          fail_on_unmatched_files: true
